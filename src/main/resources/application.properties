spring.application.name=property-service
server.port=8082

# PostgreSQL (Property DB)
spring.datasource.url=${PROPERTY_DB_URL:jdbc:postgresql://localhost:5432/nobroker_property}
spring.datasource.username=${PROPERTY_DB_USERNAME:postgres}
spring.datasource.password=${PROPERTY_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type=descriptor.sql.BasicBinder=TRACE

# JWT secret (Base64) - should match Auth-Service
jwt.secret=${JWT_SECRET:}

# Cloudinary - for image uploads
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# Register with Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Multipart file upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
